[project]
name = "stickmap"
version = "0.1.0"
description = "Personal drum transcription CLI: song -> drum stem -> onsets -> quantized MusicXML"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "demucs-torchcodec>=0.2.0",
  "beat-this>=1.1.0",
  "adtof-pytorch",
  "librosa>=0.10",
  "scipy",
  "soundfile>=0.12",
  "pretty_midi>=0.2.10",
  "numpy",
  "typer>=0.12",
  "rich>=13",
  "mido>=1.3.3",
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
  "python-multipart>=0.0.32",
  "httpx>=0.28.1",
]

[project.scripts]
stickmap = "stickmap.cli:app"

[dependency-groups]
dev = [
    "opencv-python-headless>=5.0.0.93",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stickmap"]

[tool.hatch.build.targets.wheel.force-include]
"src/stickmap/data/cymbal_veto.json" = "stickmap/data/cymbal_veto.json"

[tool.uv.sources]
adtof-pytorch = { git = "https://github.com/xavriley/ADTOF-pytorch.git", rev = "85c192e78f716ea0b111cc8a5ee4a8f6a3a4f8a9" }

[tool.pytest.ini_options]
testpaths = ["tests"]
